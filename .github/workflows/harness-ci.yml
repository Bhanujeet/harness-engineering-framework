name: Harness Mechanical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Harness Integrity & Invariant Check
        run: |
          node scripts/harness-check.mjs
